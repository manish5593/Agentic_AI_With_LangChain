[project]
name = "agentic-ai-with-langchain"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.6.7",
    "openai>=1.0.0",
    "print-color>=0.4.6",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["starter/tests"]
markers = ["integration: end-to-end tests that call the real LLM (need OPENAI_API_KEY)"]
